# DINO-WM + parallel observation probe on dm_control cartpole.
# Simpler dynamics than rocket: 1-D cart on rail, 1-D pole, 1-D actuator.
# Lyapunov monitor at rollout checks swing-up/balance convergence.
#
# Matches the rocket pipeline exactly:
#   L_wm    = MSE(predicted next pixel-latent, DINO(next image))
#   L_probe = MSE(MLP(mean-pool(DINO(image)).detach()), observation)
# The two losses update disjoint optimiser groups.

defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null

wandb:
  enable: false
  project: dinowm-probe
  entity: null

# dm_control cartpole_swingup 5-D observation:
#   [position, velocity, cos(theta), sin(theta), angular_velocity]
# 1-D action (horizontal cart force, in [-1, 1] after action_scale).
dataset_name: cartpole_swingup_expert
output_model_name: cartpole_dinowm_probe

trainer:
  max_epochs: 200
  strategy: auto
  devices: auto
  accelerator: gpu
  precision: 16-mixed

batch_size: 64
num_workers: 8
train_split: 0.9

image_size: 224
patch_size: 16

n_steps: 3
frameskip: 2

encoder_id: facebook/dinov2-small

dinowm:
  history_size: 3
  num_preds: 1
  proprio_dim: 5
  proprio_embed_dim: 16
  action_dim: 1
  action_embed_dim: 16

predictor:
  depth: 6
  heads: 8
  mlp_dim: 1024
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

predictor_lr: 3e-4
proprio_encoder_lr: 3e-4
action_encoder_lr: 3e-4

augment:
  image_noise_std: 0.02

obs_probe:
  enabled: true
  architecture: mlp_2
  hidden_dim: 128
  obs_dim: 5
  lr: 3e-4

# Lyapunov candidate for cartpole swing-up/balance:
#   V(x) = w_x * position^2
#        + w_theta * (1 - cos(theta))        # small when upright
#        + w_v * velocity^2
#        + w_wtheta * angular_velocity^2
# Indices refer to the 5-D observation [x, v, cos_t, sin_t, w_t].
lyapunov:
  mode: cartpole_swingup       # bespoke form; see scripts/rollout_monitor.py
  pos_idx: [0]
  vel_idx: [1]
  cos_theta_idx: 2
  ang_vel_idx: [4]
  w_pos: 0.1
  w_theta: 1.0
  w_vel: 0.05
  w_ang_vel: 0.1
  descent_thresh: 0.02
  k_consecutive: 3

dump_object: True
